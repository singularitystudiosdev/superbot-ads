<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>spot · superbot.gg / ads</title>
<link rel="stylesheet" href="assets/site.css?v=3">
<link rel="stylesheet" href="assets/ad.css?v=8">
<style>
  body { background: var(--bg); margin: 0; }
  /* capture page must be a pristine design-space stage: site.css zooms html
     on wide screens, which would render 100vw/100vh 1.25x past the viewport */
  html { zoom: 1 !important; }
  .fit { position: fixed; inset: 0; display: grid; place-items: center; }
  .fit .ad-player { width: 100vw; height: 100vh; }
  .hint { position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: var(--muted); opacity: 0.8; z-index: 2; }
</style>
</head>
<body class="capture">
  <div class="fit"><div class="ad-player" id="ad" data-ratio="16:9"></div></div>
  <span class="hint">space pause · r restart · h hide this</span>
  <script type="module">
    import { SPOTS } from './assets/spots.js?v=1'
    import { SpotPlayer } from './assets/engine.js?v=1'
    const q = new URLSearchParams(location.search)
    const name = q.get('spot') || 'cheaper'
    const R = q.get('ratio') || '16:9'
    const el = document.getElementById('ad')
    el.dataset.ratio = R
    const ad = new SpotPlayer(el, SPOTS[name], { ratio: R })
    el.style.aspectRatio = 'auto'
    const fit = () => ad.fit()
    addEventListener('resize', fit)
    fit()
    addEventListener('keydown', (e) => {
      if (e.code === 'Space') { e.preventDefault(); ad.paused ? ad.play() : ad.pause() }
      if (e.key === 'r') ad.restart()
      if (e.key === 'h') document.querySelector('.hint').style.display = 'none'
    })
  </script>
</body>
</html>
